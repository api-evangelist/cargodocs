openapi: 3.2.0
info:
  title: CargoDocs Partner Common API
  description: The CargoDocs Partner API enables partners and platform providers to embed CargoDocs DocEx functionality into their trade or trade finance platforms, handling original electronic bills of lading (eBoL) and warehouse warrants (eWW). The Partner Exchange API retrieves customer and partner data to perform specific actions, with endpoints to retrieve data based on conditions and filters and Action endpoints to action over transactions.
  version: 3.0.0
  contact:
    name: ICE Digital Trade (essDOCS)
    url: https://www.essdocs.com
  license:
    name: Proprietary
    url: https://www.essdocs.com
servers:
- url: https://api-test.cargodocs.com/v3
  description: Sandbox / Test Environment
- url: https://api.uat.cargodocs.com/v3
  description: UAT Environment
- url: https://api.cargodocs.com/v3
  description: Production Environment
security:
- bearerAuth: []
tags:
- name: Common
  description: Common API endpoints shared across partner operations
paths:
  /common/counterparties:
    get:
      operationId: getCounterparties
      summary: CargoDocs Get Counterparties
      description: Allows a Partner to retrieve all available counterparties.
      tags:
      - Common
      responses:
        '200':
          description: Successful response with list of counterparties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Counterparty'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  schemas:
    Counterparty:
      type: object
      properties:
        counterpartyId:
          type: string
          description: The unique identifier for the counterparty
        counterpartyName:
          type: string
          description: The name of the counterparty
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
